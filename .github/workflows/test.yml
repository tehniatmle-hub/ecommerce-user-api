name: CI – Integration Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    # ── PostgreSQL service container ────────────────────────────────────────
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # ── Environment variables available to every step ──────────────────────
    env:
      DB_HOST:     localhost
      DB_PORT:     5432
      DB_NAME:     ecommerce_test
      DB_USER:     postgres
      DB_PASSWORD: postgres
      PORT:        3000

    steps:
      # 1. Check out source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js 20 with npm cache
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json

      # 3. Install project dependencies
      - name: Install dependencies
        working-directory: vscode
        run: npm install

      # 4. Apply database schema
      - name: Apply init.sql schema
        working-directory: vscode
        run: psql -h localhost -U postgres -d ecommerce_test -f init.sql
        env:
          PGPASSWORD: postgres

      # 5. Run the full integration test suite
      - name: Run tests
        working-directory: vscode
        run: npm test
